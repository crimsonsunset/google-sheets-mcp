[project]
name = "google-sheets-mcp"
version = "0.1.0"
description = "A locally running MCP server providing cell-level and formatting-level control over Google Sheets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.scripts]
google-sheets-mcp = "google_sheets_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_sheets_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
